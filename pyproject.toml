[project]
name = "timemanager"
version = "0.1.0"
description = "A calm local-first day-planning companion"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18,<2",
    "flask>=3.1,<4",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "playwright>=1.55,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
]

[project.scripts]
timemanager = "timemanager.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timemanager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
