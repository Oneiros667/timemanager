<article class="task-row" data-task-row>
  <form action="{{ url_for('tasks.toggle_task', task_id=task.id) }}" method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <button class="task-check" type="submit" aria-label="Mark {{ task.title }} done">
      <span aria-hidden="true"></span>
    </button>
  </form>

  <div class="task-copy">
    <p>{{ task.title }}</p>
    <span>Ready when you are</span>
  </div>

  <div class="task-actions">
    {% if not task.is_highlight %}
      <form action="{{ url_for('tasks.choose_highlight', task_id=task.id) }}" method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <button class="icon-button" type="submit" title="Make this today's highlight">
          <span aria-hidden="true">◇</span>
          <span class="sr-only">Make {{ task.title }} today's highlight</span>
        </button>
      </form>
    {% endif %}
    <button
      class="focus-button secondary-button compact-button"
      type="button"
      data-focus-task="{{ task.title }}"
    >
      Focus
    </button>
    <form action="{{ url_for('tasks.drop_task', task_id=task.id) }}" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="icon-button" type="submit" title="Deliberately drop this task">
        <span aria-hidden="true">×</span>
        <span class="sr-only">Drop {{ task.title }}</span>
      </button>
    </form>
  </div>
</article>
