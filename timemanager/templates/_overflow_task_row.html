<article class="overflow-row">
  <div class="task-copy">
    <p>{{ task.title }}</p>
    <span>Waiting outside the active plan</span>
  </div>
  <div class="task-actions">
    <form action="{{ url_for('tasks.activate_task', task_id=task.id) }}" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="primary-button compact-button" type="submit">Make active</button>
    </form>
    <form action="{{ url_for('tasks.choose_highlight', task_id=task.id) }}" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="secondary-button compact-button" type="submit">Make highlight</button>
    </form>
    <form action="{{ url_for('tasks.move_to_inbox', task_id=task.id) }}" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="quiet-button compact-button" type="submit">Save for later</button>
    </form>
  </div>
</article>
